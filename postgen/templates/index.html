<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Post Generator</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; }
    .post { border: 1px solid #ccc; padding: 10px; margin-bottom: 10px; }
  </style>
</head>
<body>
  <h1>Generated Posts</h1>
  <p><a href="{{ url_for('new_post') }}">Create New Post</a></p>
  {% for post in posts %}
    <div class="post">
      <h2>{{ post.title }}</h2>
      <p>{{ post.content }}</p>
    </div>
  {% else %}
    <p>No posts yet.</p>
  {% endfor %}
</body>
</html>
