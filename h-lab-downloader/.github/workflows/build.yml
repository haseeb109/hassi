name: Build Windows EXE

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1" # weekly rebuild so the YouTube engine stays fresh

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -U -r requirements.txt pyinstaller

      - name: Download FFmpeg and Deno
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/yt-dlp/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip -OutFile ff.zip
          Expand-Archive ff.zip -DestinationPath ff
          Copy-Item (Get-ChildItem ff -Recurse -Filter ffmpeg.exe | Select-Object -First 1).FullName .
          Copy-Item (Get-ChildItem ff -Recurse -Filter ffprobe.exe | Select-Object -First 1).FullName .
          Invoke-WebRequest https://github.com/denoland/deno/releases/latest/download/deno-x86_64-pc-windows-msvc.zip -OutFile deno.zip
          Expand-Archive deno.zip -DestinationPath .

      - name: Build
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --windowed --name HLabDownloader `
            --collect-all customtkinter --collect-all yt_dlp --collect-all yt_dlp_ejs `
            --icon assets/icon.ico --add-data "assets;assets" h_lab_downloader.py
          Copy-Item ffmpeg.exe, ffprobe.exe, deno.exe dist/HLabDownloader/
          Compress-Archive dist/HLabDownloader/* HLabDownloader-Windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: HLabDownloader-Windows
          path: HLabDownloader-Windows.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: HLabDownloader-Windows.zip
